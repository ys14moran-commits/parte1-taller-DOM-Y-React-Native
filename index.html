
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactividad con el DOM</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>
<body>

    
<div class="tarjeta">

    <h1>Interactividad con el DOM</h1>

    <p class="subtitulo">
        Haz clic en el botón para aumentar tus likes.
    </p>

    <div class="contador-contenedor">

        <span id="contador">0</span>

        <p>Likes registrados</p>

    </div>

    <button id="btn-like">
         Me gusta
    </button>
    
<div class="registros">

    <h2>Historial de clics</h2>

    <table>

        <thead>
            <tr>
                <th>No Clic</th>
                <th>Hora</th>
            </tr>
        </thead>

        <tbody id="tabla-registros">
            
        </tbody>

    </table>

</div>


</div>


</body>
</html>
